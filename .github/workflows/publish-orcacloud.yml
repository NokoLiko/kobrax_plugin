# On each published GitHub release: build the wheel, attach it to the release and publish it
# as a new version on Orca Cloud. Based on the workflow in the Orca Cloud guide
# (https://cloud.orcaslicer.com/wiki/ → "Publish from GitHub").
#
# One-time setup in Orca Cloud: Shared Plugins → this plugin → Edit plugin → GitHub publishing →
# connect "NokoLiko/kobrax_plugin". No secrets needed: it authenticates with GitHub OIDC.
name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC token for Orca Cloud
  contents: write # attach the wheel to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pyproject.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Build the wheel
        run: |
          set -euo pipefail
          pipx run build --wheel
          # Orca Cloud wants an OS suffix before the extension; the plugin is pure Python.
          wheel="$(ls dist/*.whl)"
          cp "$wheel" "dist/kobrax_plugin_any.whl"
          ls -l dist

      - name: Attach the wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/kobrax_plugin-*.whl --clobber

      - name: Publish release to OrcaCloud
        env:
          PLUGIN_FILES: "dist/kobrax_plugin_any.whl"
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          # --form-string: with -F, a ";" in the changelog cuts the JSON (curl reads it as a field option)
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
